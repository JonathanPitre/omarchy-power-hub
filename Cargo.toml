[package]
name = "power-hub"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
fixture-root = []

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
